<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Empresa | Cardápio / Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
  
        <div class="profile">
            <h1><i class="fa-solid fa-utensils"></i> Nosso Cardápio</h1>
            <p>Confira nossos produtos e opções disponíveis.</p>
        </div>

        <!-- Bloco Retangular com Bordas Arredondadas para a Imagem -->
        <div class="catalog-card">
            <!-- DICA: Substitua o 'src' abaixo pelo nome do arquivo da foto do seu cardápio (ex: cardapio.jpg) -->
            <img src="marca-sua-empresa-1024x1024-1.png" alt="Cardápio da Empresa" class="catalog-image">
            <p class="catalog-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Toque na imagem para ampliar se necessário</p>
        </div>

        <!-- Área do Botão de Voltar -->
        <div class="back-area">
            <a href="index.html" class="btn">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>

        <!-- Rodapé -->
        <footer class="footer">
            <p>Desenvolvido com tecnologia própria.</p>
        </footer>

    </div>

</body>
</html>
